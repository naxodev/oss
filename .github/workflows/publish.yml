name: Publish

on:
  push:
    tags:
      - 'gonx@v*'
      - 'nx-cloudflare@v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. gonx@v5.0.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-production:
    name: Publish Production Release
    if: github.event_name == 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: publish-production-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Resolve release tag
        id: meta
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        shell: bash
        run: |
          export LC_ALL=C
          number='(0|[1-9][0-9]*)'
          identifier="($number|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)"
          pattern="^(gonx|nx-cloudflare)@v($number\\.$number\\.$number)(-$identifier(\\.$identifier)*)?$"
          if [[ ${#RELEASE_TAG} -gt 256 || ! "$RELEASE_TAG" =~ $pattern ]]; then
            echo '::error::Expected a supported project and an exact stable or prerelease version'
            exit 1
          fi
          project=${RELEASE_TAG%@v*}
          version=${RELEASE_TAG#*@v}
          dist_tag=latest
          if [[ $version == *-* ]]; then dist_tag=next; fi
          printf 'tag=%s\nproject=%s\nversion=%s\ndist_tag=%s\n' \
            "$RELEASE_TAG" "$project" "$version" "$dist_tag" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.meta.outputs.tag }}
          persist-credentials: false

      - name: Checkout registry verification tools
        # A manual rerun of an old release uses the verifier from this workflow.
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .publish-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/scripts/npm-registry.ts
            tools/scripts/published-package.ts

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11

      - name: Assert source manifest matches tag
        env:
          PROJECT: ${{ steps.meta.outputs.project }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          node <<'NODE'
          const { PROJECT, VERSION } = process.env;
          const pkg = require(`./packages/${PROJECT}/package.json`);
          if (pkg.name !== `@naxodev/${PROJECT}` || pkg.version !== VERSION)
            throw new Error('Source manifest does not match release tag');
          NODE

      - name: Check whether version is already published
        id: published
        run: bun .publish-tools/tools/scripts/published-package.ts check
        env:
          NPM_PACKAGE_NAMES: '@naxodev/${{ steps.meta.outputs.project }}'
          NPM_PACKAGE_VERSION: ${{ steps.meta.outputs.version }}

      - name: Build package
        if: steps.published.outputs.skip != 'true'
        env:
          PROJECT: ${{ steps.meta.outputs.project }}
        run: bunx nx run "$PROJECT:build"

      - name: Assert dist manifest matches tag
        if: steps.published.outputs.skip != 'true'
        env:
          PROJECT: ${{ steps.meta.outputs.project }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          node <<'NODE'
          const { PROJECT, VERSION } = process.env;
          const pkg = require(`./dist/packages/${PROJECT}/package.json`);
          if (pkg.name !== `@naxodev/${PROJECT}` || pkg.version !== VERSION)
            throw new Error('Dist manifest does not match release tag');
          NODE

      - name: Publish package
        if: steps.published.outputs.skip != 'true'
        env:
          PROJECT: ${{ steps.meta.outputs.project }}
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
          npm_config_registry: https://registry.npmjs.org
        run: npm publish "dist/packages/$PROJECT" --tag "$DIST_TAG" --access public --ignore-scripts

      - name: Verify package is live
        run: bun .publish-tools/tools/scripts/published-package.ts verify
        env:
          NPM_PACKAGE_NAMES: '@naxodev/${{ steps.meta.outputs.project }}'
          NPM_PACKAGE_VERSION: ${{ steps.meta.outputs.version }}
